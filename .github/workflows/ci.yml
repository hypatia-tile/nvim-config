name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ after/ ftplugin/ init.lua

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install Deno
        # Needed by denops.vim / skkeleton at startup.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache plugins
        # bin/check restores plugins into the nvim-dev data dir to match
        # lazy-lock.json; cache it so runs after the first are a no-op.
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim-dev
          key: nvim-dev-plugins-${{ hashFiles('lazy-lock.json') }}
          restore-keys: nvim-dev-plugins-

      - name: Headless load check
        run: bin/check
